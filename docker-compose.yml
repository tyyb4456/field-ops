name: fieldops-ai

# Shared application image and wiring for the API. The API is behind the "app"
# profile so `docker compose up` starts only the infrastructure dependencies.
# Start the API stack with:
#   docker compose --profile app up --build
#
# Database migrations are managed by Alembic. After the postgres service is
# healthy, apply them from the backend directory with:
#   uv run alembic upgrade head
# Celery workers/beat remain intentionally out of scope for Phase 2.
x-app-image: &app-image
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: fieldops-ai-backend:local

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://fieldops:fieldops@postgres:5432/fieldops
  REDIS_URL: redis://redis:6379/0

x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    container_name: fieldops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg17
    container_name: fieldops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops
      POSTGRES_DB: fieldops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    <<: *app-image
    container_name: fieldops-api
    profiles: ["app"]
    restart: unless-stopped
    environment:
      <<: *app-environment
    depends_on:
      <<: *app-depends-on
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/var/document_storage

volumes:
  postgres_data:
  redis_data:
  document_storage:
