# Alembic configuration for FieldOps AI.
#
# The database URL is intentionally not hardcoded here. It is resolved by
# alembic/env.py from (in order):
#   1. the ``sqlalchemy.url`` value passed programmatically (used by tests)
#   2. the application settings / DATABASE_URL environment variable
#
# Run migrations from the backend directory:
#   uv run alembic upgrade head
#   uv run alembic downgrade -1
#   uv run alembic current
#   uv run alembic revision --autogenerate -m "description"

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC

sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
